name: Publish examples (presets)
on:
  schedule:
    - cron: "0 16 1/2 * *"
  workflow_dispatch:
  workflow_call:

permissions: {}

jobs:
  examples:
    runs-on: ubuntu-latest
    if: github.repository == 'gh-metrics/metrics'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Setup NodeJS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 20
          cache: "npm"
      - name: Setup metrics
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish presets examples
        # zizmor: ignore[use-trusted-publishing] False-positive.
        run: npm run presets -- publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
