name: Continuous integration

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

jobs:

  # Build, test and analyze
  build-test-analyze:
    name: Build, test and analyze
    if: ${{ !contains(github.event.head_commit.message, '[skip test]') }}
    uses: $/.github/workflows/test.yml
    permissions:
      contents: read # Check out and test the repository.

  # Update plugins and template indexes, along with README.md
  update-indexes:
    name: Publish rebuilt metrics indexes
    runs-on: ubuntu-latest
    needs: [build-test-analyze]
    permissions:
      contents: write # Commit and push regenerated indexes.
    steps:
      # zizmor: ignore[artipacked] Credentials are required to publish regenerated files.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: master
      - name: Setup NodeJS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 20
          cache: "npm"
      - name: Setup metrics
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish rebuild metrics indexes
        # zizmor: ignore[use-trusted-publishing] This publishes generated files to Git, not an npm package.
        run: npm run build -- publish

  # Rebase main branch on master
  update-main:
    name: Rebase main on master
    runs-on: ubuntu-latest
    needs: [update-indexes]
    permissions:
      contents: write # Merge master into and push the main branch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: main
      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge master into main
        run: git merge origin/master
      - name: Push main
        run: git push origin main

  # Build docker image from master and publish it to GitHub registry
  docker-master:
    name: Publish master to GitHub registry
    runs-on: ubuntu-latest
    needs: [update-indexes]
    permissions:
      contents: read # Build the image from repository contents.
      packages: write # Publish master and beta container images.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Login to GitHub registry
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build docker image
        run: docker build -t ghcr.io/gh-metrics/metrics:master .
      - name: Publish to GitHub registry
        run: docker push ghcr.io/gh-metrics/metrics:master
      - name: Tag docker image (beta) and publish to GitHub registry
        run: |
          set +e
          METRICS_VERSION=$(cat package.json | grep -Po '(?<="version": ")\d+[.]\d+(?=[.]0-beta")')
          METRICS_VERSION_BETA="$METRICS_VERSION-beta"
          set -e
          if [[ ! -z "$METRICS_VERSION" ]]; then
            echo "Beta version: v$METRICS_VERSION_BETA"
            docker tag ghcr.io/gh-metrics/metrics:master ghcr.io/gh-metrics/metrics:$(echo "v$METRICS_VERSION_BETA")
            docker push ghcr.io/gh-metrics/metrics:$(echo "v$METRICS_VERSION_BETA")
          fi
      - name: Tag docker image (main) and publish to GitHub registry
        run: |
          docker tag ghcr.io/gh-metrics/metrics:master ghcr.io/gh-metrics/metrics:main
          docker push ghcr.io/gh-metrics/metrics:main

  # Deploy to beta-metrics.lecoq.io
  deploy-master:
    name: Deploy gh-metrics/metrics@master
    runs-on: ubuntu-latest
    needs: [docker-master]
    if: github.repository_owner == 'lowlighter'
    steps:
      - name: Deploy web instance
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_BETA_TOKEN }}
        run: "curl -X POST -H 'Authorization: $WEB_DEPLOY_TOKEN' https://beta-metrics.lecoq.io/.control/stop"
      - name: Wait for redeploy
        run: sleep 120
      - name: Check deployment status
        run: "curl --retry 15 --retry-delay 60 https://beta-metrics.lecoq.io/.version"

  # Test gh-metrics/metrics@master
  action-master-test:
    name: Test gh-metrics/metrics@master
    runs-on: ubuntu-latest
    needs: [docker-master]
    steps:
      - name: Run tests
        uses: $/
        with:
          token: MOCKED_TOKEN
          plugins_errors_fatal: yes
          dryrun: yes
          use_mocked_data: yes
          verify: yes

  # Publish examples
  publish-examples:
    name: Publish examples
    needs: [action-master-test]
    uses: $/.github/workflows/examples.yml
    permissions:
      contents: write # Publish generated examples.
      packages: read # Pull the metrics action image.
    secrets:
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
      METRICS_TOKEN_WITH_SCOPES: ${{ secrets.METRICS_TOKEN_WITH_SCOPES }}
      METRICS_TOKEN_PERSONAL: ${{ secrets.METRICS_TOKEN_PERSONAL }}
      CHESS_TOKEN: ${{ secrets.CHESS_TOKEN }}
      PAGESPEED_TOKEN: ${{ secrets.PAGESPEED_TOKEN }}
      GOOGLE_MAP_TOKEN: ${{ secrets.GOOGLE_MAP_TOKEN }}
      SPLATOON_TOKEN: ${{ secrets.SPLATOON_TOKEN }}
      SPLATOON_STATINK_TOKEN: ${{ secrets.SPLATOON_STATINK_TOKEN }}
      SIXTEEN_PERSONALITIES_URL: ${{ secrets.SIXTEEN_PERSONALITIES_URL }}
      SPOTIFY_TOKENS: ${{ secrets.SPOTIFY_TOKENS }}
      STOCK_TOKEN: ${{ secrets.STOCK_TOKEN }}
      TWITTER_TOKEN: ${{ secrets.TWITTER_TOKEN }}
      WAKATIME_TOKEN: ${{ secrets.WAKATIME_TOKEN }}

  # Publish examples (presets)
  publish-examples-presets:
    name: Publish examples (presets)
    needs: [action-master-test]
    uses: $/.github/workflows/examples.presets.yml
    permissions:
      contents: write # Publish generated preset examples.

  # Build docker image from master and publish it to GitHub registry with release tag
  docker-release:
    name: Publish release to GitHub registry
    runs-on: ubuntu-latest
    needs: [publish-examples]
    if: contains(github.event.head_commit.message, '[release]')
    permissions:
      contents: read # Read release metadata from the repository.
      packages: write # Publish release and latest container images.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - name: Login to GitHub registry
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Pull docker image (master)
        run: docker pull ghcr.io/gh-metrics/metrics:master
      - name: Tag docker image (release)
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: docker tag ghcr.io/gh-metrics/metrics:master ghcr.io/gh-metrics/metrics:$(echo $GITHUB_COMMIT_MESSAGE | grep -Po 'v\d+[.]\d+')
      - name: Publish release to GitHub registry
        env:
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: docker push ghcr.io/gh-metrics/metrics:$(echo $GITHUB_COMMIT_MESSAGE | grep -Po 'v\d+[.]\d+')
      - name: Tag docker image (latest)
        run: docker tag ghcr.io/gh-metrics/metrics:master ghcr.io/gh-metrics/metrics:latest
      - name: Publish latest to GitHub registry
        run: docker push ghcr.io/gh-metrics/metrics:latest

  # Rebase latest branch on master
  update-latest:
    name: Rebase latest on master
    runs-on: ubuntu-latest
    needs: [docker-release]
    permissions:
      contents: write # Merge master into and push the latest branch.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: true
          fetch-depth: 0
          ref: latest
      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Merge master into latest
        run: git merge origin/master
      - name: Push latest
        run: git push origin latest

  # Test gh-metrics/metrics@latest
  action-latest-test:
    name: Test gh-metrics/metrics@latest
    runs-on: ubuntu-latest
    needs: [update-latest]
    permissions:
      packages: read # Pull the metrics action image.
    steps:
      - name: Run tests
        uses: gh-metrics/metrics@latest # zizmor: ignore[unpinned-uses] First-party action must test latest.
        with:
          token: MOCKED_TOKEN
          plugins_errors_fatal: yes
          dryrun: yes
          use_mocked_data: yes
          verify: yes

  # Deploy to metrics.lecoq.io
  deploy-latest:
    name: Deploy gh-metrics/metrics@latest
    runs-on: ubuntu-latest
    needs: [docker-release, deploy-master]
    if: github.repository_owner == 'lowlighter'
    steps:
      - name: Deploy web instance
        env:
          WEB_DEPLOY_TOKEN: ${{ secrets.WEB_DEPLOY_TOKEN }}
        run: "curl -X POST -H 'Authorization: $WEB_DEPLOY_TOKEN' https://metrics.lecoq.io/.control/stop"
      - name: Wait for redeploy
        run: sleep 120
      - name: Check deployment status
        run: "curl --retry 15 --retry-delay 60 https://metrics.lecoq.io/.version"

  # Publish GitHub release
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [action-latest-test, deploy-latest]
    permissions:
      contents: write # Create the GitHub release.
    steps:
      # zizmor: ignore[artipacked] Credentials are required to replace an existing release tag.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: true
      - name: Setup NodeJS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.0.0
        with:
          node-version: 20
          cache: "npm"
      - name: Setup metrics
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish release
        run: node .github/scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
