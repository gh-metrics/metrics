# Experimental branch only: deliberately replaces the inherited publishing-adjacent test entrypoint.
# The default branch already registers test.yml for workflow_dispatch; choose this experiment branch.
name: Isolated Metrics experiments

on:
  workflow_dispatch:
    inputs:
      public_examples:
        description: Also test the public HIMEHINA page and public sample personality profile
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  experiment:
    if: github.repository == 'rakuzen25/metrics' && startsWith(github.ref, 'refs/heads/experiment/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      METRICS_ARTIFACT_DIR: ${{ runner.temp }}/metrics-experiment-artifacts
    steps:
      - name: Checkout the selected source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Use Node 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate the source build and generated files
        run: |
          npm run build
          git diff --exit-code
          npm run linter
      - name: Run focused source regressions
        run: npx --no-install jest --runInBand --testPathPattern='regression.test.js$'
      - name: Install the matching test browser
        run: node node_modules/puppeteer/install.js
      - name: Exercise cold 1920x1080 fixtures in real Chromium
        run: node tests/browser/screenshot.integration.mjs
      - name: Check public examples against this source (optional)
        if: inputs.public_examples
        run: node tests/browser/public-examples.mjs
      - name: Keep only fixture screenshots for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metrics-experiment-fixtures
          path: ${{ env.METRICS_ARTIFACT_DIR }}
          if-no-files-found: ignore
          retention-days: 7
